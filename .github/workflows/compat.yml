name: ui-mobile compatibility

# Verify the ui-mobile overlay still builds and typechecks against each
# supported DeepSeek Harness release. A version bump is only "done" when this
# matrix stays green — so a harness change that would break the overlay is
# caught here, not by the first user who upgrades.
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: dsh ${{ matrix.harness }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The install-time select wrapper (compat-patch.mjs) picks the overlay
        # line by the actual harness version: >= 0.1.2 uses the alpha.3+ client
        # layer (ui-mobile-v2), older (rc.2) uses the v1 overlay (ui-mobile-v1).
        # rc.2 is the last v1-line release; alpha.5 is the latest v2-line tag.
        # Running both keeps both lines green on this branch.
        harness: [dsh-v0.1.1-rc.2, dsh-v0.1.2-alpha.5]
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay

      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.harness }}
          path: harness

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # Materialize the overlay as a workspace member (INSTALL.md §1-2). The
      # patch is a file: no inline shell quotes for different shells to mangle.
      - name: Install overlay into the harness checkout
        run: node overlay/scripts/compat-patch.mjs harness overlay

      - name: Install
        working-directory: harness
        # The overlay is a new workspace member, so the harness lockfile is
        # intentionally out of date until install; CI defaults to frozen-lockfile,
        # so opt out so pnpm can add the overlay's importers.
        run: pnpm install --no-frozen-lockfile

      - name: Build
        working-directory: harness
        # build:lib runs host first (generates the api/remotes types the client
        # build resolves), then the client bundle — required on a cold checkout.
        run: pnpm run build:lib

      # Belt-and-suspenders: the plugin's own package typechecks in isolation too.
      - name: Typecheck ui-mobile
        working-directory: harness
        run: pnpm exec tsc -b packages/client/ui-mobile
